
costmap:
   global_frame: livox_odom
   robot_base_frame: base_link
   update_frequency: 10
   publish_frequency: 10
   static_map: false
   rolling_window : true
   transform_tolerance: 0.5
   resolution: 0.1 # overwritten by static map resolution
   always_send_full_costmap : true
   plugins:
   -  name: "livox_layer"
      type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
   -  name: "inflat_layer"
      type : "costmap_2d::InflationLayer"
   livox_layer:
      enabled:               true
      voxel_decay:           2    #seconds if linear, e^n if exponential
      decay_model:           0      #0=linear, 1=exponential, -1=persistent
      voxel_size:            0.1    #meters
      track_unknown_space:   true   #default space is unknown
      observation_persistence: 0.0  #seconds
      max_obstacle_height:   3.0    #meters
      unknown_threshold:     1      #voxel height
      mark_threshold:        0      #voxel height
      update_footprint_enabled: true
      combination_method:    1      #1=max, 0=override
      obstacle_range:        10.0    #meters
      origin_z:              1.0    #meters
      publish_voxel_map:     true   # default off
      transform_tolerance:   0.5    # seconds
      mapping_mode:          false  # default off, saves map not for navigation
      map_save_duration:     60     #default 60s, how often to autosave
      observation_sources:   "livox3d"
      livox3d:
         data_type: "PointCloud2"
         topic: "/livox_ray/obstacle"
         marking: true
         clearing: true
         min_obstacle_height: -1     #default 0, meters
         max_obstacle_height: 10.0     #defaule 3, meters
         expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
         observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest 
         inf_is_valid: true          # default false, for laser scans
         clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
         filter: "voxel"              # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommended to have at one filter on
         voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
         model_type: 1                # default 0, 0 DEPTH_CAMERA, 1 THREE_DIMENSIONAL_LIDAR
         decay_acceleration: 1        # default 0
         vertical_fov_angle : 3.15
         vertical_fov_padding : 3.15
         horizontal_fov_angle : 3.15
         min_z : -2
         max_z : 10
   inflat_layer:
      inflation_radius: 0.5
      cost_scaling_factor: 10